    episodes_per_tied_pair: 12
    seed_start_offset_from_primary: 100
    candidate_scope: tied_top_only
    non_top_candidate_reentry_forbidden: true
    paired_simulator_seeds_across_tied_pairs: true
    same_frozen_train_variant_support_replicated: true
    distinct_simulator_seeds_from_initial: true
  combined_selection:
    episodes_per_tied_pair: 24
    order_same_as_empirical_selection_order: true
    final_fallback_order:
      - prefer_exact_final_if_still_tied
      - prefer_target_critic_if_still_tied
  validation_used_for_selection: false
  formal_test_used_for_selection: false

