hypothesis:
  name: proper_calibrated_ranked_risk
  statement: >-
    Cross instability is driven by weak rare-event gradients and insufficient
    action-conditioned ordering from MSE training of a sigmoid collision-return
    critic, compounded by seed-sensitive shared representations. A proper soft
    Bernoulli objective, continuous target-difference ranking, and EMA risk
    consistency will improve the learned risk model without an inference rule.
  falsifier: >-
    Complete fresh development fails any preregistered outcome gate, the learned
    risk-ranking diagnostics are non-finite or inactive, or any deployed action
    is changed by a rule, projection, threshold, shield, or postprocessor.

model_change:
  collision_return_loss: soft_target_binary_cross_entropy_with_logits
  collision_pairwise_ranking:
    coefficient: 0.25
    pair_weight: absolute_soft_td_target_difference
    normalization: sum_of_pair_weights
    hard_target_threshold: false
    fixed_ranking_margin: false
  collision_temporal_consistency:
    coefficient: 0.05
    teacher: exponential_moving_average_target_collision_critic
    student: online_collision_critic
    same_observation_action_pairs: true
    loss: probability_mean_squared_error
    teacher_gradient: false
  collision_risk_coefficient: 1.0
  deterministic_model_score_changed_from_v4_10: false
  actor_objective_changed_from_v4_10: false
  proposal_model_changed_from_v4_10: false

