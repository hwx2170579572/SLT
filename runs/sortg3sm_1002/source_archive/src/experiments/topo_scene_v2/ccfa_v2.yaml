stages:
  - id: V2-S0
    title: Freeze v1/v2 source and assets
    owner: ccf-pipeline-orchestrator
    status: passed
    pass_condition: Freeze manifest and six-scenario topology audit both validate.
  - id: V2-S1
    title: Implement isolated v2 modules and unit tests
    owner: codex-implementation
    status: passed
    depends_on: [V2-S0]
    pass_condition: Targeted tests, serialization, zero-gate equivalence, and full regression pass.
  - id: V2-S2
    title: Freeze CCFA evidence contract
    owner: ccf-experiment-designer
    status: passed
    depends_on: [V2-S1]
    pass_condition: Contract validator expands unique jobs and formal test is gate-protected.
  - id: V2-S3
    title: Run fast 20k 2x2 and cumulative mechanism screens
    owner: experiment-runner
    status: passed
    depends_on: [V2-S2]
    pass_condition: Each executed validation stage is strictly accepted, deeply attributed, and stopped/promoted by its predeclared rule.
  - id: V2-S4
    title: Freeze candidate and pass paired 50k promotion gate
    owner: root-cause-analysis
    status: failed
    depends_on: [V2-S3]
    pass_condition: Candidate selection plus the two-seed, three-anchor promotion receipt are computed from real validation runs and the gate passes.
    observed: 12/12 accepted, but macro-success, worst-paired-seed, and positive-effect checks failed.
    decision: Reject v5_soft_1e2 and keep formal testing locked.
  - id: V2-S4B
    title: Bounded zero-training action-calibration salvage
    owner: root-cause-analysis
    status: failed
    depends_on: [V2-S4]
    pass_condition: CARLA stage A and conditional Cross stage B both pass their preregistered gates.
    observed: CARLA success 0, timeout 1, applied lane change 0; Cross was not run.
    decision: Reject scalar calibration and stop the rapid-iteration cycle.
  - id: V2-S5
    title: Ten-seed formal test
    owner: experiment-runner
    status: planned
    depends_on: [V2-S4]
    pass_condition: Hash-matched promotion gate passes and 120 matched 100k formal runs complete on the untouched test partition.
    gate_state: locked_after_failed_dependency
    launch_allowed: false
    formal_test_accessed: false
  - id: V2-S6
    title: Integrity audit and final bounded report
    owner: ccf-integrity-auditor
    status: planned
    depends_on: [V2-S5]
    pass_condition: Settings, hashes, numeric summaries, claims, and missing-cell status agree.
  - id: V2-S6N
    title: Bounded negative development report
    owner: ccf-experiment-designer
    status: passed
    depends_on: [V2-S4B]
    pass_condition: Promotion and salvage failures, exact hashes, unexecuted stages, and the formal lock are recorded without invented results.
