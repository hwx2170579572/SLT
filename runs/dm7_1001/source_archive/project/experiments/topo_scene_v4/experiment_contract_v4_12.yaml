hypothesis:
  name: augmented_joint_replay_supported_ranked_risk
  statement: >-
    The v4.11 lane actor is not actually replay-supported because its support
    NLL covers conditional speed only, while deterministic selection omits the
    lane probability. Completing joint lane/speed support and enabling the
    already-existing rotation augmentation for Cross will improve unseen-
    traffic generalization without a rule or safety projection.
  falsifier: >-
    Fresh development fails the preregistered paired parent-improvement and
    guard gates, required ablations do not complete, promotion violates any
    per-scenario noninferiority gate, or any runtime action differs from the
    exact learned model argmax.

model_change:
