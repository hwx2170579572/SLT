hypothesis:
  name: gradient_isolated_tempered_joint_support_prcr
  statement: >-
    Replay-lane supervision is useful to the deployed lane distribution, but
    its full-strength gradient through the actor latent trunk competes with
    conditional speed-mixture learning and perturbs the collection feedback
    loop. Calibrating the same lane head from a detached latent at scale 0.25
    will retain Cross gains, recover roundabout-medium, and retain CARLA.
  falsifier: >-
    Exact gradient-isolation tests fail, any rule/projection appears, fresh D1-D4
    fails any preregistered gate, required ablations are incomplete after a
    primary pass, or fresh promotion violates any noninferiority/positive-effect gate.

model_change:
  deployed_lane_logits: lane_head(actor_latent)
  auxiliary_lane_support_logits: lane_head(stop_gradient(actor_latent))
  same_lane_head_parameters: true
  new_inference_head: false
  lane_categorical_nll:
    replay_actions_only: true
    physical_lane_mask_only: true
    scale_inside_joint_nll: 0.25
    gradient_targets: [deployed_lane_head]
    zero_gradient_targets: [actor_latent_trunk, component_head, speed_mean_head, speed_log_std_head, scene_encoder]
  conditional_speed_mixture_nll:
    unchanged: true
    gradient_targets: [actor_latent_trunk, component_head, speed_mean_head, speed_log_std_head]
  replay_support_outer_coefficient: 0.05
  lane_log_prior_coefficient: 0.05
  component_log_prior_coefficient: 0.05
  inference_score_equation_changed: false
  scenario_conditioned: false

