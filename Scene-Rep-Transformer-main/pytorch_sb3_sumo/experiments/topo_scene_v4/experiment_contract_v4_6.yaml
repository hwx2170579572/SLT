  selected_model_hash_must_match_receipt: true
  selected_decoder_must_match_receipt: true
  calibration_trace_and_episode_records_required: true
  partial_checkpoint_ineligible: true
  validation_used_for_selection: false
  formal_test_used_for_selection: false

