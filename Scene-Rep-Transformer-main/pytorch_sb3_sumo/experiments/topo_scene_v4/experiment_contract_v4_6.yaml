single_change:
  name: train_only_joint_checkpoint_decoder_selector
  checkpoint_candidates: [highest_training_success, exact_final]
  decoder_candidates: [target_critic, fusion_0_90]
  candidate_pairs: 4
  target_critic_rule: keep_tie_aware_argmax_feasible_min_target_twin_q
  fusion_rule: actor_confident_non_keep_else_target_critic
  actor_non_keep_confidence_threshold: 0.90
  actor_override_requires_non_keep: true
  actor_override_requires_action_mask_feasible: true
  scenario_name_branching: false
  calibration_partition: train
  calibration_episodes_per_pair: 12
  paired_calibration: true
  identical_unique_traffic_block_for_all_pairs: true
  selection_order:
    - maximize_success_count
    - minimize_collision_count
    - minimize_off_route_count
    - minimize_timeout_count
    - maximize_mean_return
    - prefer_exact_final_on_complete_outcome_tie
    - prefer_target_critic_on_complete_checkpoint_decoder_tie
  missing_training_best_fallback: exact_final
  deployment_receipt_must_predate_validation: true
  training_changed: false
  stochastic_actor_changed: false
  reward_changed: false
  encoder_changed: false
  critic_training_changed: false
  entropy_changed: false
  decoder_definitions_changed: false
  fusion_threshold_changed: false

fixed_runtime:
  conda_environment: llm_pipeline
  device: cuda
  batch_size: 32
  learning_rate: 0.0001
  discount: 0.99
  replay_buffer_capacity: 20000
  n_step: 4
  learning_starts_raw_steps: 5000
  action_repeat: 3
  traffic_protocol: frozen_60_20_20
  training_partition: train
  development_partition: validation
  formal_partition: test
  episode_limit_profile: source
  actor_encoder_detach: true
  slot_balance_coef: 0.01
  lane_entropy_scale: 0.0
  speed_target_entropy: -1.0
  exact_final_checkpoint_rule: exactly_at_requested_raw_steps
  training_best_checkpoint_rule:
    metric: highest_training_success_rate_last_20
    fixed_denominator: 20
    minimum_completed_episodes_exclusive: 20
    tie_break: earliest_strict_improvement

terminal_event_semantics:
  source_flags_may_overlap: true
  event_rates_imply_integral_counts: true
  counts_bounded_by_episode_population: true
  summary_counts_match_episode_records: true
  every_episode_has_terminal_event_flag: true
  overlap_evidence_recorded: true
  event_precedence_added: false
  event_relabeling: false

decoder_integrity:
  selected_decoder_exact_rule_match_rate: 1.00
  selected_action_mask_feasible_rate: 1.00
  exact_hybrid_lateral_code_rate: 1.00
  target_decoder:
    exact_target_critic_argmax_rate: 1.00
    keep_tie_rule_exact_rate: 1.00
  fusion_decoder:
    exact_fusion_rule_match_rate: 1.00
    actor_override_predicate_valid_rate: 1.00
    target_fallback_rule_match_rate: 1.00
    threshold_must_equal: 0.90
  decoder_trace_and_episode_records_required: true

selector_integrity:
  calibration_environment_constructed_before_validation: true
  validation_environment_forbidden_until_receipt_sealed: true
  test_environment_forbidden_until_promotion_and_receipt_sealed: true
  four_pairs_use_identical_calibration_seeds: true
  four_pairs_use_identical_traffic_order: true
