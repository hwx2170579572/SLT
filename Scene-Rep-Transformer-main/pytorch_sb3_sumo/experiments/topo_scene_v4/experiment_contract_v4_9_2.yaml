schema_version: topo-scene-v4.9.2.strict-target-only-deployment-contract/v1
status: locked_before_implementation_and_before_promotion
created_at_local: '2026-08-26T12:00:00+08:00'
no_fabrication: true
formal_test_locked: true

lineage:
  parent_scientific_method: v4_9_learned_collision_value_model
  parent_scientific_contract: experiments/topo_scene_v4/experiment_contract_v4_9.yaml
  parent_scientific_contract_sha256: 4a8f39b734357efda228e1981c0a3d1bf956dba2cdd6af0d49cfafa8b7aae16d
