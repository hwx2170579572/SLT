schema_version: ccfa.stage-contract/v1
updated_at: 2026-08-30T20:34:20+08:00
project:
  id: full_decision_aligned_balanced_slots_v4
  mode: standard
  research_stage: v4_11_1_running_v4_11_2_short_path_recovery_scheduled
  venue_family: AI/ML
  target_venue: unknown
  objective: >-
    Improve at least one scenario over TemporalGraph while limiting every other
    scenario to at most slight success/collision degradation.
  immediate_decision: >-
    v4.10 failed only D1 after all four development jobs and was completely
    attributed. v4.11 improves the learned risk model with proper soft-target
    Bernoulli loss, continuous target-difference ranking, and detached EMA
    consistency; it adds no rule or kinematic projection. Fresh v4.11 D1-D4
    all passed (Cross aggregate success/collision 0.775/0.225, RAM 0.90/0.10,
    CARLA 1.0/0.0). Both preregistered mechanism ablations completed: soft-BCE
    only reached 0.70/0.30, ranked without EMA consistency reached
    0.50/0.45 with 0.05 timeout, and the full model reached 0.75/0.25 on D1;
    this supports EMA consistency as the main stability contribution in that
    seed. The first promotion run completed, while Cross TemporalGraph seed21
    was interrupted at 32,783/50,000 raw steps. v4.11.1 preserves that tree
    and its attempt-all runner is now detached from the Codex session. Its first
    versioned retry exposed a 278-character TensorBoard path failure and then
    correctly continued to later jobs. v4.11.2 shortens only fresh runtime paths
    to a tested 195-character representative event path. A detached waiter will
    start it only after v4.11.1 finishes. Formal remains locked until the full
    frozen promotion gate passes.
runtime:
  conda_environment: llm_pipeline
  device_preference: cuda
  formal_test_partition: locked
