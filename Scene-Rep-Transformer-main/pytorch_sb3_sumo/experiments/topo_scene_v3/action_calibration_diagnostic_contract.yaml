lineage:
  v2_fast_protocol_sha256: 42b6b32c343125ca4e97cbdb26019fa0bbf63b785edd13612b996a8710090455
  v2_candidate_selection_sha256: 424b60ea7397e602da7b768ccffd3d981fe7c844268eabf80f3c9302416b7b04
