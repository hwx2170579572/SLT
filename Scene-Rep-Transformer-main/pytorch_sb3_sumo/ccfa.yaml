project:
  id: scene_rep_topo_graph_slt_l1
  mode: standard
  scope_diagnosis: multi-stage
  research_stage: mixed workflow
  venue_family: AI/ML
  target_venue: unknown
  audience: autonomous-driving and reinforcement-learning reviewers
  objective: >-
    Preserve the released PyTorch/SB3/SUMO/SAC baselines while adding a
    topology-query, per-timestep vehicle graph, temporal encoder, structured
    latent, and Graph-SLT; validate the implementation and only report results
    generated by executable experiments.
  immediate_decision: >-
    Determine whether the complete topology-temporal representation improves
    closed-loop driving without worsening collisions, and isolate whether any
    gain comes from temporal vehicle interaction or road topology.
  privacy_boundary: private local research code and unpublished results

runtime:
  conda_environment: llm_pipeline
  python: 3.10.20
  torch: 2.10.0+cu128
  stable_baselines3: 2.9.0
  gymnasium: 1.2.3
  sumo: 1.25.0
  device_preference: cuda
  install_policy: dependencies may be installed directly; prefer D drive
  project_root: .

invariants:
  baseline_freeze_artifact: artifacts/ccfa/baseline_freeze.json
  protected_algorithms:
    mst:
      meaning: MST+SAC without SLT
      feature_extractor: HierarchicalSceneExtractor
    scene_rep:
      meaning: MST+SLT+SAC
      feature_extractor: HierarchicalSceneExtractor
  protected_behavior:
    - reward
    - action_space
    - SAC actor and twin critics
    - entropy coefficient
    - N-step replay and one-step SLT target
    - action repeat and raw-step update clock
    - optimizer families and learning rates
  l1_fixed_values:
    hidden_dim: 128
    final_features_dim: 128
    num_heads: 2
    max_topology_nodes: 64
    max_topology_edges: 256
    lane_sample_points: 10
    topology_relations: 5
    representation_coef: 1.0
  excluded_from_l1:
    - topology tokenizer pretraining
    - frozen topology encoder
    - multi-step representation replay
    - causal loss
    - occupancy loss
    - TTC auxiliary loss
    - variance regularization
  no_silent_truncation: true
  no_fabricated_results: true

research:
  scientific_origin: >-
    The released MST encoder pools each actor history before explicit
    interaction and has no persistent road-topology representation.
  gap: >-
    It is unknown whether preserving per-frame interaction and querying static
    lane connectivity yields policy-relevant information rather than merely a
    lower auxiliary representation loss.
  core_insight: >-
    Static lane tokens should be queried by dynamic vehicle-time tokens before
    symmetric vehicle message passing and only then temporally aggregated.
  contribution_type:
    - new module in an existing reinforcement-learning pipeline
    - empirical mechanism study
  questions:
    - id: RQ1
      text: Does Full outperform MST+SLT in closed-loop driving?
    - id: RQ2
      text: Is any gain attributable to the temporal vehicle graph or topology query?
    - id: RQ3
      text: Are time, memory, and inference overhead acceptable?
  claim_evidence:
    - claim_id: C1
      claim: Full improves success while collision does not worsen versus scene_rep.
      evidence: matched left_turn development screen followed by three-scenario, three-seed confirmation
      metrics: [success_rate, collision_rate, mean_return]
      status: rejected_in_development
    - claim_id: C2
      claim: The temporal vehicle graph preserves interaction information beyond early temporal pooling.
      evidence: temporal_graph versus scene_rep ablation plus TTC/min-distance probes
      metrics: [success_rate, collision_rate, minimum_ttc_probe, minimum_distance_probe]
      status: not_supported_as_an_improvement
    - claim_id: C3
      claim: Topology query adds value beyond the temporal vehicle graph.
      evidence: topo_scene versus temporal_graph ablation and topology-attention diagnostics
      metrics: [success_rate, collision_rate, route_branch_probe, attention_locality]
      status: rejected_for_original_full
    - claim_id: C4
      claim: Added graph computation has bounded operational overhead.
      evidence: matched parameter, update-time, inference-time, and peak-memory profiling
      metrics: [parameter_count, train_ms_per_update, inference_ms, peak_gpu_memory_mb]
      status: measured_without_acceptance_threshold

stages:
  - id: S0
    title: Freeze and verify original baselines
    owner: ccf-pipeline-orchestrator
    status: passed
    depends_on: []
    inputs:
      - id: migrated_source_manifest
        path: MIGRATION_ORIGINAL_SHA256.json
        required: true
      - id: existing_test_suite
        path: tests_sb3_sumo
        required: true
    outputs:
      - id: baseline_freeze
        path: artifacts/ccfa/baseline_freeze.json
        required: true
    checks:
      - id: protected_file_hashes
        type: sha256_manifest
        path: artifacts/ccfa/baseline_freeze.json
      - id: pre_change_test_exit
        type: json_assert
        path: artifacts/ccfa/baseline_freeze.json
        field: pre_change_tests.exit_code
        operator: eq
        expected: 0
      - id: migration_source_unchanged
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/verify_migration_invariant.py]
        cwd: .
        timeout_seconds: 120
        expected_exit_code: 0
        stdout_contains: '"ok": true'
    pass_condition:
      mode: all
      check_ids: [protected_file_hashes, pre_change_test_exit, migration_source_unchanged]
    blocker:
      when: Any protected baseline hash or migration invariant changes.
      action: Stop extension work and restore or explicitly re-baseline with human approval.
    handoff:
      next_stage: S1
      owner: ccf-pipeline-orchestrator
      packet: [artifacts/ccfa/baseline_freeze.json]

  - id: S1
    title: Establish machine-checkable stage contract
    owner: ccf-pipeline-orchestrator
    status: passed
    depends_on: [S0]
    inputs:
      - id: l1_design
        path: ccfa.yaml
        required: true
    outputs:
      - id: stage_contract
        path: ccfa.yaml
        required: true
      - id: contract_checker
        path: tools/check_ccfa_contract.py
        required: true
    checks:
      - id: contract_file_exists
        type: path_exists
        path: ccfa.yaml
        kind: file
      - id: checker_file_exists
        type: path_exists
        path: tools/check_ccfa_contract.py
        kind: file
      - id: schema_validation
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/check_ccfa_contract.py]
        cwd: .
        timeout_seconds: 120
        expected_exit_code: 0
    pass_condition:
      mode: all
      check_ids: [contract_file_exists, checker_file_exists, schema_validation]
    blocker:
      when: Stage DAG, required fields, or check references are invalid.
      action: Repair the contract before changing research code.
    handoff:
      next_stage: S2
      owner: codex-implementation
      packet: [ccfa.yaml, tools/check_ccfa_contract.py]

  - id: S2
    title: Parse and audit deterministic SUMO lane topology
    owner: codex-implementation
    status: passed
    depends_on: [S1]
    inputs:
      - id: released_maps
        path: envs/sumo/original_scenarios_v1
        required: true
    outputs:
      - id: topology_parser
        path: envs/sumo/topology_graph.py
        required: true
      - id: topology_scan
        path: artifacts/ccfa/topology_scan.json
        required: true
    checks:
      - id: parser_exists
        type: path_exists
        path: envs/sumo/topology_graph.py
        kind: file
      - id: audit_six_maps
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/audit_topology_graphs.py, --output, artifacts/contracts/topology_scan_recheck.json]
        cwd: .
        timeout_seconds: 120
        expected_exit_code: 0
      - id: capacity_gate
        type: json_assert
        path: artifacts/ccfa/topology_scan.json
        field: all_within_capacity
        operator: truthy
      - id: parser_tests
        type: command
        argv: [conda, run, -n, llm_pipeline, python, -m, pytest, tests_sb3_sumo/test_topology_graph.py, -q, --basetemp, tmp/ccfa_s2_pytest]
        cwd: .
        timeout_seconds: 300
        expected_exit_code: 0
        stdout_contains: 10 passed
    pass_condition:
      mode: all
      check_ids: [parser_exists, audit_six_maps, capacity_gate, parser_tests]
    blocker:
      when: A lane/edge is truncated, inverse relation is missing, or parsing is nondeterministic.
      action: Fix the parser; never increase experimental scope to hide a graph error.
    handoff:
      next_stage: S3
      owner: codex-implementation
      packet: [envs/sumo/topology_graph.py, artifacts/ccfa/topology_scan.json]

  - id: S3
    title: Build topology-temporal structured encoder
    owner: codex-implementation
    status: passed
    depends_on: [S2]
    inputs:
      - id: topology_graph
        path: envs/sumo/topology_graph.py
        required: true
      - id: baseline_coordinate_contract
        path: algos/sb3_torch/features.py
        required: true
    outputs:
      - id: topology_temporal_encoder
        path: algos/sb3_torch/topo_temporal_features.py
        required: true
    checks:
      - id: encoder_exists
        type: path_exists
        path: algos/sb3_torch/topo_temporal_features.py
        kind: file
      - id: encoder_mechanism_tests
        type: command
        argv: [conda, run, -n, llm_pipeline, python, -m, pytest, tests_sb3_sumo/test_topo_temporal.py, -q, --basetemp, tmp/ccfa_s3_pytest]
        cwd: .
        timeout_seconds: 600
        expected_exit_code: 0
        stdout_contains: 12 passed
    pass_condition:
      mode: all
      check_ids: [encoder_exists, encoder_mechanism_tests]
    blocker:
      when: Shape, finite-value, padding, permutation, rotation, or gradient checks fail.
      action: Diagnose the first failing invariant before proceeding to RL training.
    handoff:
      next_stage: S4
      owner: codex-implementation
      packet: [algos/sb3_torch/topo_temporal_features.py, tests_sb3_sumo/test_topo_temporal.py]

  - id: S4
    title: Integrate structured Graph-SLT and SB3 lifecycle
    owner: codex-implementation
    status: passed
    depends_on: [S3]
    inputs:
      - id: one_step_replay_target
        path: algos/sb3_torch/replay_buffer.py
        required: true
    outputs:
      - id: graph_slt
        path: algos/sb3_torch/graph_representation.py
        required: true
      - id: sac_integration
        path: algos/sb3_torch/sac.py
        required: true
      - id: config_registration
        path: configs/sb3_configs.py
        required: true
    checks:
      - id: graph_slt_exists
        type: path_exists
        path: algos/sb3_torch/graph_representation.py
        kind: file
      - id: compile_integration
        type: command
        argv: [conda, run, -n, llm_pipeline, python, -m, py_compile, algos/sb3_torch/graph_representation.py, algos/sb3_torch/sac.py, configs/sb3_configs.py, tools/train_sb3.py]
        cwd: .
        timeout_seconds: 120
        expected_exit_code: 0
      - id: update_save_load_test
        type: command
        argv: [conda, run, -n, llm_pipeline, python, -m, pytest, 'tests_sb3_sumo/test_topo_temporal.py::test_topo_scene_single_update_save_and_load', -q, --basetemp, tmp/ccfa_s4_pytest]
        cwd: .
        timeout_seconds: 600
        expected_exit_code: 0
        stdout_contains: 2 passed
    pass_condition:
      mode: all
      check_ids: [graph_slt_exists, compile_integration, update_save_load_test]
    blocker:
      when: A slot loss is non-finite, action conditioning is inert, or checkpoint reload differs.
      action: Repair Graph-SLT/SB3 ownership and serialization before SUMO experiments.
    handoff:
      next_stage: S5
      owner: codex-verification
      packet: [algos/sb3_torch/graph_representation.py, algos/sb3_torch/sac.py, configs/sb3_configs.py]

  - id: S5
    title: Full regression and live SUMO smoke verification
    owner: codex-verification
    status: passed
    depends_on: [S4]
    inputs:
      - id: complete_source_tree
        path: .
        required: true
    outputs:
      - id: verification_report
        path: artifacts/ccfa/verification_report.json
        required: true
      - id: live_sumo_check
        path: artifacts/ccfa/sumo_check.json
        required: true
    checks:
      - id: full_pytest
        type: command
        argv: [conda, run, -n, llm_pipeline, python, -m, pytest, tests_sb3_sumo, -q, --basetemp, tmp/ccfa_s5_full]
        cwd: .
        timeout_seconds: 1200
        expected_exit_code: 0
      - id: verification_artifact
        type: json_assert
        path: artifacts/ccfa/verification_report.json
        field: passed
        operator: truthy
      - id: sumo_smoke_artifact
        type: json_assert
        path: artifacts/ccfa/sumo_check.json
        field: status
        operator: eq
        expected: ok
    pass_condition:
      mode: all
      check_ids: [full_pytest, verification_artifact, sumo_smoke_artifact]
    blocker:
      when: Any legacy regression, check_env failure, SUMO rollout failure, or save/load failure occurs.
      action: Return to the owning implementation stage with the smallest reproducer.
    handoff:
      next_stage: S6
      owner: ccf-experiment-designer
      packet: [artifacts/ccfa/verification_report.json, artifacts/ccfa/sumo_check.json]

  - id: S6
    title: Freeze claim-evidence experiment protocol
    owner: ccf-experiment-designer
    status: passed
    depends_on: [S5]
    inputs:
      - id: verified_implementation
        path: artifacts/ccfa/verification_report.json
        required: true
    outputs:
      - id: experiment_contract
        path: experiments/topo_scene/experiment_contract.yaml
        required: true
      - id: execution_plan
        path: experiments/topo_scene/README.md
        required: true
    checks:
      - id: experiment_contract_exists
        type: path_exists
        path: experiments/topo_scene/experiment_contract.yaml
        kind: file
      - id: experiment_contract_validation
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/run_topo_experiments.py, validate]
        cwd: .
        timeout_seconds: 120
        expected_exit_code: 0
    pass_condition:
      mode: all
      check_ids: [experiment_contract_exists, experiment_contract_validation]
    blocker:
      when: Baselines, traffic partitions, raw-step budgets, metrics, or stop rules are unmatched.
      action: Repair protocol fairness before consuming training compute.
    handoff:
      next_stage: S7
      owner: experiment-runner
      packet: [experiments/topo_scene/experiment_contract.yaml]

  - id: S7
    title: Run matched development screening
    owner: experiment-runner
    status: passed
    depends_on: [S6]
    inputs:
      - id: development_protocol
        path: experiments/topo_scene/experiment_contract.yaml
        required: true
    outputs:
      - id: development_summary
        path: results_topo_scene/development/summary.json
        required: true
      - id: development_gate
        path: results_topo_scene/development/gate_decision.json
        required: true
    checks:
      - id: development_results_exist
        type: path_exists
        path: results_topo_scene/development/summary.json
        kind: file
      - id: development_gate_computed
        type: json_assert
        path: results_topo_scene/development/gate_decision.json
        field: computed_from_real_runs
        operator: truthy
    pass_condition:
      mode: all
      check_ids: [development_results_exist, development_gate_computed]
    blocker:
      when: NaN, graph overflow, collision degradation, or non-local topology attention violates the development gate.
      action: Do not start formal confirmation; route evidence to S8 diagnosis.
    handoff:
      next_stage: S8
      owner: root-cause-analysis
      packet: [results_topo_scene/development/summary.json, results_topo_scene/development/gate_decision.json]

  - id: S8
    title: Diagnose mechanisms and iterate under explicit stop rules
    owner: root-cause-analysis
    status: passed
    depends_on: [S7]
    inputs:
      - id: matched_development_runs
        path: results_topo_scene/development
        required: true
    outputs:
      - id: attribution_report
        path: results_topo_scene/diagnosis/attribution.json
        required: true
      - id: iteration_ledger
        path: results_topo_scene/diagnosis/iteration_ledger.json
        required: true
    checks:
      - id: attribution_is_evidence_bound
        type: json_assert
        path: results_topo_scene/diagnosis/attribution.json
        field: evidence_bound
        operator: truthy
      - id: iteration_stop_decision_exists
        type: json_assert
        path: results_topo_scene/diagnosis/iteration_ledger.json
        field: final_decision
        operator: in
        expected: [confirm, retain_temporal_only, redesign_topology, stop]
    pass_condition:
      mode: all
      check_ids: [attribution_is_evidence_bound, iteration_stop_decision_exists]
    blocker:
      when: Results cannot distinguish representation information from policy utilization or safety trade-offs.
      action: Add the minimum probe/diagnostic experiment; do not add arbitrary network depth.
    handoff:
      next_stage: S9
      owner: experiment-runner
      packet: [results_topo_scene/diagnosis/attribution.json, results_topo_scene/diagnosis/iteration_ledger.json]

  - id: S9
    title: Confirmation, aggregation, and final bounded result
    owner: ccf-experiment-designer
    status: passed
    depends_on: [S8]
    inputs:
      - id: iteration_decision
        path: results_topo_scene/diagnosis/iteration_ledger.json
        required: true
    outputs:
      - id: final_summary
        path: results_topo_scene/final/final_summary.json
        required: true
      - id: final_report
        path: results_topo_scene/final/FINAL_REPORT.md
        required: true
      - id: integrity_audit
        path: results_topo_scene/final/integrity_audit.json
        required: true
    checks:
      - id: final_summary_real
        type: json_assert
        path: results_topo_scene/final/final_summary.json
        field: fabricated_values
        operator: eq
        expected: false
      - id: final_claim_bounded
        type: json_assert
        path: results_topo_scene/final/final_summary.json
        field: claim_boundary_recorded
        operator: truthy
      - id: final_report_exists
        type: path_exists
        path: results_topo_scene/final/FINAL_REPORT.md
        kind: file
      - id: final_integrity_passed
        type: json_assert
        path: results_topo_scene/final/integrity_audit.json
        field: passed
        operator: truthy
      - id: final_integrity_recheck
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/audit_topo_final_artifacts.py]
        cwd: .
        timeout_seconds: 300
        expected_exit_code: 0
        stdout_contains: '"passed": true'
    pass_condition:
      mode: all
      check_ids: [final_summary_real, final_claim_bounded, final_report_exists, final_integrity_passed, final_integrity_recheck]
    blocker:
      when: Required confirmation runs are incomplete or protocols do not match.
      action: Mark missing cells TBD and report only the completed engineering/development evidence.
    handoff:
      next_stage: S10
      owner: ccf-experiment-designer
      packet: [results_topo_scene/final/final_summary.json, results_topo_scene/final/FINAL_REPORT.md]

  - id: S10
    title: Freeze the six-method six-scenario systematic matrix
    owner: ccf-experiment-designer
    status: passed
    depends_on: [S9]
    inputs:
      - id: completed_development_evidence
        path: results_topo_scene/final/final_summary.json
        required: true
      - id: user_matrix_request
        path: experiments/systematic_matrix/README.md
        required: true
    outputs:
      - id: systematic_protocol
        path: experiments/systematic_matrix/protocol.json
        required: true
      - id: systematic_protocol_validator
        path: tools/validate_systematic_matrix.py
        required: true
      - id: systematic_analysis_tool
        path: tools/analyze_systematic_matrix.py
        required: true
      - id: compute_budget_decision
        path: artifacts/contracts/systematic_matrix_budget_decision.json
        required: true
    checks:
      - id: systematic_protocol_exists
        type: path_exists
        path: experiments/systematic_matrix/protocol.json
        kind: file
      - id: systematic_protocol_validator_exists
        type: path_exists
        path: tools/validate_systematic_matrix.py
        kind: file
      - id: systematic_analysis_tool_exists
        type: path_exists
        path: tools/analyze_systematic_matrix.py
        kind: file
      - id: systematic_protocol_validation
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/validate_systematic_matrix.py]
        cwd: .
        timeout_seconds: 180
        expected_exit_code: 0
        stdout_contains: '"passed": true'
    pass_condition:
      mode: all
      check_ids: [systematic_protocol_exists, systematic_protocol_validator_exists, systematic_analysis_tool_exists, systematic_protocol_validation]
    blocker:
      when: The contract does not expand to exactly 108 unique jobs or any method/scenario/seed/evaluation pairing is ambiguous.
      action: Repair the protocol before running any matrix workload.
    handoff:
      next_stage: S11
      owner: codex-verification
      packet: [experiments/systematic_matrix/protocol.json, artifacts/contracts/systematic_matrix_protocol_validation.json]

  - id: S11
    title: Verify all 36 algorithm-scenario interfaces
    owner: codex-verification
    status: passed
    depends_on: [S10]
    inputs:
      - id: frozen_systematic_protocol
        path: experiments/systematic_matrix/protocol.json
        required: true
    outputs:
      - id: systematic_preflight_report
        path: results_systematic_matrix/selected/_preflight/preflight_report.json
        required: true
    checks:
      - id: preflight_report_exists
        type: path_exists
        path: results_systematic_matrix/selected/_preflight/preflight_report.json
        kind: file
      - id: preflight_passed
        type: json_assert
        path: results_systematic_matrix/selected/_preflight/preflight_report.json
        field: passed
        operator: truthy
      - id: all_algorithm_scenario_pairs_checked
        type: json_assert
        path: results_systematic_matrix/selected/_preflight/preflight_report.json
        field: unique_algorithm_scenario_pairs_checked
        operator: eq
        expected: 36
      - id: preflight_protocol_hash_matches
        type: command
        argv: [conda, run, -n, llm_pipeline, python, tools/validate_systematic_matrix.py, --preflight-report, results_systematic_matrix/selected/_preflight/preflight_report.json]
        cwd: .
        timeout_seconds: 180
        expected_exit_code: 0
        stdout_contains: '"passed": true'
    pass_condition:
      mode: all
      check_ids: [preflight_report_exists, preflight_passed, all_algorithm_scenario_pairs_checked, preflight_protocol_hash_matches]
    blocker:
      when: Any algorithm cannot construct, reset, produce a finite deterministic action, or close cleanly in any scenario.
      action: Diagnose the exact algorithm-scenario cell; do not launch training around a failed interface.
    handoff:
      next_stage: S12
      owner: experiment-runner
      packet: [results_systematic_matrix/selected/_preflight/preflight_report.json, artifacts/contracts/systematic_matrix_budget_decision.json]

  - id: S12
    title: Execute 108 matched training and final-evaluation jobs
    owner: experiment-runner
    status: in_progress
    depends_on: [S11]
    inputs:
      - id: confirmed_budget
        path: artifacts/contracts/systematic_matrix_budget_decision.json
        required: true
      - id: systematic_preflight_report
        path: results_systematic_matrix/selected/_preflight/preflight_report.json
        required: true
    outputs:
      - id: matrix_orchestrator_state
        path: results_systematic_matrix/selected/orchestrator_state.json
        required: true
      - id: carla_provenance_incident
        path: artifacts/contracts/systematic_matrix_carla_provenance_incident.json
        required: false
      - id: matrix_pause_control
        path: results_systematic_matrix/selected/pause_control.json
        required: false
    checks:
      - id: budget_confirmed
        type: json_assert
        path: artifacts/contracts/systematic_matrix_budget_decision.json
        field: status
        operator: eq
        expected: confirmed
      - id: orchestration_finished
        type: json_assert
        path: results_systematic_matrix/selected/orchestrator_state.json
        field: status
        operator: eq
        expected: finished
      - id: all_training_runs_complete
        type: json_assert
        path: results_systematic_matrix/selected/orchestrator_state.json
        field: counts.complete
        operator: eq
        expected: 108
      - id: no_partial_training_runs
        type: json_assert
        path: results_systematic_matrix/selected/orchestrator_state.json
        field: counts.partial
        operator: eq
        expected: 0
      - id: no_pending_training_runs
        type: json_assert
        path: results_systematic_matrix/selected/orchestrator_state.json
        field: counts.pending
        operator: eq
        expected: 0
    pass_condition:
      mode: all
      check_ids: [budget_confirmed, orchestration_finished, all_training_runs_complete, no_partial_training_runs, no_pending_training_runs]
    blocker:
      when: Budget is not explicitly frozen, disk headroom is inadequate, a run is partial, or an artifact fails its raw-step/checkpoint/evaluation contract.
      action: Preserve partial evidence, recover evaluation-only interruptions when valid, and never impute missing cells.
    handoff:
      next_stage: S13
      owner: ccf-experiment-designer
      packet: [results_systematic_matrix/selected/orchestrator_state.json]

  - id: S13
    title: Aggregate paired three-seed fifty-episode evidence
    owner: ccf-experiment-designer
    status: planned
    depends_on: [S12]
    inputs:
      - id: complete_matrix_runs
        path: results_systematic_matrix/selected
        required: true
    outputs:
      - id: generic_matrix_summary
        path: results_systematic_matrix/selected/summary/summary.json
        required: true
      - id: systematic_summary
        path: results_systematic_matrix/selected/systematic_analysis/systematic_summary.json
        required: true
    checks:
      - id: generic_summary_complete
        type: json_assert
        path: results_systematic_matrix/selected/summary/summary.json
        field: runs_completed
        operator: eq
        expected: 108
      - id: systematic_summary_complete
        type: json_assert
        path: results_systematic_matrix/selected/systematic_analysis/systematic_summary.json
        field: matrix_complete
        operator: truthy
      - id: no_fabricated_matrix_values
        type: json_assert
        path: results_systematic_matrix/selected/systematic_analysis/systematic_summary.json
        field: fabricated_values
        operator: eq
        expected: false
    pass_condition:
      mode: all
      check_ids: [generic_summary_complete, systematic_summary_complete, no_fabricated_matrix_values]
    blocker:
      when: Any cell lacks three accepted seeds, 50 episodes per policy, matching protocol hashes, or paired evaluation provenance.
      action: Keep the cell TBD and return it to S12; do not pool incomplete or incompatible evidence.
    handoff:
      next_stage: S14
      owner: root-cause-analysis
      packet: [results_systematic_matrix/selected/systematic_analysis/systematic_summary.json]

  - id: S14
    title: Deep attribution, robustness synthesis, and final matrix report
    owner: root-cause-analysis
    status: planned
    depends_on: [S13]
    inputs:
      - id: systematic_summary
        path: results_systematic_matrix/selected/systematic_analysis/systematic_summary.json
        required: true
    outputs:
      - id: systematic_attribution
        path: results_systematic_matrix/selected/systematic_analysis/attribution.json
        required: true
      - id: systematic_final_report
        path: results_systematic_matrix/selected/systematic_analysis/FINAL_REPORT.md
        required: true
    checks:
      - id: attribution_evidence_bound
        type: json_assert
        path: results_systematic_matrix/selected/systematic_analysis/attribution.json
        field: evidence_bound
        operator: truthy
      - id: confounding_limit_recorded
        type: json_assert
        path: results_systematic_matrix/selected/systematic_analysis/attribution.json
        field: topology_and_balancing_confound_recorded
        operator: truthy
      - id: systematic_final_report_exists
        type: path_exists
        path: results_systematic_matrix/selected/systematic_analysis/FINAL_REPORT.md
        kind: file
    pass_condition:
      mode: all
      check_ids: [attribution_evidence_bound, confounding_limit_recorded, systematic_final_report_exists]
    blocker:
      when: Observed deltas cannot distinguish a predeclared mechanism or primary safety metrics disagree with the proposed explanation.
      action: State the non-identifiability explicitly and propose only the minimum additional ablation; do not invent a causal explanation.
    handoff:
      next_stage: null
      owner: user
      packet: [results_systematic_matrix/selected/systematic_analysis/systematic_summary.json, results_systematic_matrix/selected/systematic_analysis/attribution.json, results_systematic_matrix/selected/systematic_analysis/FINAL_REPORT.md]
